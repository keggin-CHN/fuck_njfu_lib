{% extends "base.html" %}

{% block title %}登录 - 图书馆座位预约系统{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="card-header">
            <h4>用户登录</h4>
        </div>
        <div class="card-body">
            <!-- 密码遗忘公告 -->
            <div class="alert alert-info text-center mb-3">
                <i class="bi bi-envelope-fill"></i> 遗忘密码请联系管理员: <a href="mailto:admin@mail.keggin.me">admin@mail.keggin.me</a>
            </div>

            <form method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">学号</label>
                    <input type="text" class="form-control" id="username" name="username" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">密码</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary">登录</button>
                </div>
            </form>
            <div class="text-center mt-3">
                <p>还没有账号？<a href="{{ url_for('register') }}">立即注册</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// 加载公告
function loadAnnouncement() {
    console.log('Loading announcement on login page...');
    fetch('/api/announcement')
        .then(response => response.json())
        .then(data => {
            console.log('Announcement data:', data);
            if (data.success && data.content && data.content.trim()) {
                document.getElementById('announcementContent').textContent = data.content;
                if (data.updated_at) {
                    document.getElementById('announcementTime').textContent = '更新时间: ' + data.updated_at;
                }
                document.getElementById('announcementContainer').style.display = 'block';
                console.log('Announcement displayed on login page');
            } else {
                console.log('No announcement content');
            }
        })
        .catch(error => {
            console.error('加载公告失败:', error);
        });
}

// 页面加载时加载公告
document.addEventListener('DOMContentLoaded', loadAnnouncement);
</script>
{% endblock %}
