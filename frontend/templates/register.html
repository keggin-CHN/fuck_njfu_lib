{% extends "base.html" %}

{% block title %}注册 - 图书馆座位预约系统{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="card-header">
            <h4>新用户注册</h4>
        </div>
        <div class="card-body">
            <div class="alert alert-info mb-3 small">
                <i class="bi bi-info-circle me-2"></i>
                统一认证密码与 <a href="https://webvpn.njfu.edu.cn" target="_blank" class="text-white">WebVPN</a> 一致。
            </div>
            <form method="post" id="registerForm">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="username" class="form-label">学号</label>
                        <input type="text" class="form-control" id="username" name="username" value="{{ username if remember_form else '' }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="password" class="form-label">网站密码</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="edu_password" class="form-label">统一认证密码</label>
                        <input type="password" class="form-control" id="edu_password" name="edu_password" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="lib_password" class="form-label">图书馆密码</label>
                        <input type="password" class="form-control" id="lib_password" name="lib_password" required>
                    </div>
                </div>

                <div class="mb-3" id="inviteCodeGroup" style="display: none;">
                    <label for="invite_code" class="form-label">邀请码</label>
                    <input type="text" class="form-control" id="invite_code" name="invite_code" placeholder="请输入8位邀请码" maxlength="8" style="text-transform: uppercase;">
                    <small class="text-muted">请联系管理员获取邀请码</small>
                </div>

                {% if need_captcha %}
                <div class="mb-3" id="captchaGroup">
                    <label for="captcha" class="form-label">验证码</label>
                    <div class="input-group">
                        <input type="text" class="form-control" id="captcha" name="captcha" required>
                        <span class="input-group-text p-0">
                            <img id="captchaImage" src="/captcha" alt="验证码" style="height: 38px; cursor: pointer;" title="点击刷新验证码">
                        </span>
                    </div>
                </div>
                {% endif %}

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary">注册</button>
                </div>
            </form>
            <div class="text-center mt-3">
                <p>已有账号？<a href="{{ url_for('login') }}">立即登录</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    fetch('/check_invite_code_required')
        .then(response => response.json())
        .then(data => {
            const inviteCodeGroup = document.getElementById('inviteCodeGroup');
            const inviteCodeInput = document.getElementById('invite_code');
            if (data.need_invite_code) {
                inviteCodeGroup.style.display = 'block';
                inviteCodeInput.required = true;
            }
        });

    const inviteCodeInput = document.getElementById('invite_code');
    if (inviteCodeInput) {
        inviteCodeInput.addEventListener('input', function() {
            this.value = this.value.toUpperCase();
        });
    }

    const captchaImage = document.getElementById('captchaImage');
    if (captchaImage) {
        captchaImage.addEventListener('click', function() {
            this.src = '/captcha?' + new Date().getTime();
        });
    }
});
</script>
{% endblock %}
