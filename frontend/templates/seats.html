{% extends "base.html" %}
{% block title %}座位查询{% endblock %}
{% block content %}
<div class="container-fluid mt-4">
    <div class="row">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2><i class="bi bi-building me-2"></i>图书馆座位查询</h2>
                <div class="btn-group" role="group">
                    <button type="button" class="btn btn-primary active" id="todayBtn" data-days="0">
                        <i class="bi bi-calendar-day me-1"></i>今天
                    </button>
                    <button type="button" class="btn btn-outline-primary" id="tomorrowBtn" data-days="1">
                        <i class="bi bi-calendar-plus me-1"></i>明天
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 进度条 -->
    <div id="progressContainer" class="mb-4" style="display: none;">
        <div class="progress">
            <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
        </div>
    </div>

    <!-- 加载提示 -->
    <div id="loadingIndicator" class="text-center py-5" style="display: none;">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">加载中...</span>
        </div>
        <p class="mt-3 text-muted">正在获取座位数据...</p>
    </div>

    <!-- 总览统计 -->
    <div class="row mb-4" id="totalStats" style="display: none;">
        <div class="col-md-3 mb-3">
            <div class="card border-primary">
                <div class="card-body">
                    <h6 class="card-subtitle mb-2 text-muted">
                        <i class="bi bi-hash"></i> 总座位数
                    </h6>
                    <h3 class="card-title mb-0" id="totalSeats">-</h3>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card border-success">
                <div class="card-body">
                    <h6 class="card-subtitle mb-2 text-muted">
                        <i class="bi bi-check-circle"></i> 空闲座位
                    </h6>
                    <h3 class="card-title mb-0 text-success" id="availableSeats">-</h3>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card border-danger">
                <div class="card-body">
                    <h6 class="card-subtitle mb-2 text-muted">
                        <i class="bi bi-x-circle"></i> 已占用
                    </h6>
                    <h3 class="card-title mb-0 text-danger" id="occupiedSeats">-</h3>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card border-info">
                <div class="card-body">
                    <h6 class="card-subtitle mb-2 text-muted">
                        <i class="bi bi-percent"></i> 占用率
                    </h6>
                    <h3 class="card-title mb-0 text-info" id="occupiedRate">-</h3>
                </div>
            </div>
        </div>
    </div>

    <!-- 楼层筛选 -->
    <div class="row mb-3" id="floorFilter" style="display: none;">
        <div class="col-12">
            <div class="btn-group flex-wrap" role="group">
                <button type="button" class="btn btn-outline-secondary active" data-floor="all">
                    全部楼层
                </button>
            </div>
        </div>
    </div>

    <!-- 楼层和区域信息 -->
    <div class="row" id="areasContainer">
        <!-- 动态加载 -->
    </div>
</div>

<script>
let currentDaysOffset = 0;
let allAreasData = null;
let currentFloor = 'all';
let progressInterval;

// 页面加载时获取数据
document.addEventListener('DOMContentLoaded', function() {
    loadSeatsData(0);

    // 日期切换按钮
    document.getElementById('todayBtn').addEventListener('click', function() {
        if (currentDaysOffset !== 0) {
            currentDaysOffset = 0;
            document.getElementById('todayBtn').classList.add('active');
            document.getElementById('todayBtn').classList.remove('btn-outline-primary');
            document.getElementById('todayBtn').classList.add('btn-primary');
            document.getElementById('tomorrowBtn').classList.remove('active');
            document.getElementById('tomorrowBtn').classList.add('btn-outline-primary');
            document.getElementById('tomorrowBtn').classList.remove('btn-primary');
            loadSeatsData(0);
        }
    });

    document.getElementById('tomorrowBtn').addEventListener('click', function() {
        if (currentDaysOffset !== 1) {
            currentDaysOffset = 1;
            document.getElementById('tomorrowBtn').classList.add('active');
            document.getElementById('tomorrowBtn').classList.remove('btn-outline-primary');
            document.getElementById('tomorrowBtn').classList.add('btn-primary');
            document.getElementById('todayBtn').classList.remove('active');
            document.getElementById('todayBtn').classList.add('btn-outline-primary');
            document.getElementById('todayBtn').classList.remove('btn-primary');
            loadSeatsData(1);
        }
    });

});

// 加载座位数据
function loadSeatsData(daysOffset) {
    document.getElementById('loadingIndicator').style.display = 'block';
    document.getElementById('totalStats').style.display = 'none';
    document.getElementById('floorFilter').style.display = 'none';
    document.getElementById('areasContainer').innerHTML = '';
    document.getElementById('progressContainer').style.display = 'block';
    updateProgressBar(0);

    // 开始轮询进度
    progressInterval = setInterval(fetchProgress, 500);

    fetch(`/api/seats/summary?days_offset=${daysOffset}`)
        .then(response => response.json())
        .then(data => {
            clearInterval(progressInterval);
            if (data.success) {
                allAreasData = data;
                displayTotalStats(data.total);
                displayFloorFilter(data.floors);
                displayAreas(data.areas, data.floors);
                document.getElementById('loadingIndicator').style.display = 'none';
                document.getElementById('totalStats').style.display = 'flex';
                document.getElementById('floorFilter').style.display = 'block';
                document.getElementById('progressContainer').style.display = 'none';
            } else {
                alert('获取数据失败: ' + data.message);
                document.getElementById('loadingIndicator').style.display = 'none';
                document.getElementById('progressContainer').style.display = 'none';
            }
        })
        .catch(error => {
            clearInterval(progressInterval);
            console.error('Error:', error);
            alert('获取数据失败，请稍后重试');
            document.getElementById('loadingIndicator').style.display = 'none';
            document.getElementById('progressContainer').style.display = 'none';
        });
}

// 获取进度
function fetchProgress() {
    fetch('/api/seats/progress')
        .then(response => response.json())
        .then(data => {
            updateProgressBar(data.progress);
        })
        .catch(error => {
            console.error('Error fetching progress:', error);
        });
}

// 更新进度条
function updateProgressBar(progress) {
    const progressBar = document.getElementById('progressBar');
    const progressPercentage = Math.round(progress * 100);
    progressBar.style.width = progressPercentage + '%';
    progressBar.textContent = progressPercentage + '%';
    progressBar.setAttribute('aria-valuenow', progressPercentage);
}

// 显示总览统计
function displayTotalStats(total) {
    document.getElementById('totalSeats').textContent = total.total;
    document.getElementById('availableSeats').textContent = total.available;
    document.getElementById('occupiedSeats').textContent = total.occupied;
    document.getElementById('occupiedRate').textContent = total.rate + '%';
}

// 显示楼层筛选按钮
function displayFloorFilter(floors) {
    const filterContainer = document.querySelector('#floorFilter .btn-group');
    const allButton = filterContainer.querySelector('[data-floor="all"]');

    // 清除除"全部楼层"外的所有按钮
    Array.from(filterContainer.children).forEach(btn => {
        if (btn.dataset.floor !== 'all') {
            btn.remove();
        }
    });

    // 添加楼层按钮
    Object.keys(floors).sort((a, b) => parseInt(a) - parseInt(b)).forEach(floor => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'btn btn-outline-secondary';
        btn.dataset.floor = floor;
        btn.textContent = floor + '层';
        btn.addEventListener('click', function() {
            filterByFloor(floor);
        });
        filterContainer.appendChild(btn);
    });

    // 重新绑定"全部楼层"按钮事件
    allButton.onclick = function() {
        filterByFloor('all');
    };
}

// 按楼层筛选
function filterByFloor(floor) {
    currentFloor = floor;

    // 更新按钮状态
    document.querySelectorAll('#floorFilter .btn').forEach(btn => {
        if (btn.dataset.floor === floor) {
            btn.classList.add('active');
            btn.classList.remove('btn-outline-secondary');
            btn.classList.add('btn-secondary');
        } else {
            btn.classList.remove('active');
            btn.classList.add('btn-outline-secondary');
            btn.classList.remove('btn-secondary');
        }
    });

    // 重新显示区域
    displayAreas(allAreasData.areas, allAreasData.floors);
}

// 显示区域信息
function displayAreas(areas, floors) {
    const container = document.getElementById('areasContainer');
    container.innerHTML = '';

    // 按楼层分组
    const floorGroups = {};
    for (let areaName in areas) {
        const area = areas[areaName];
        const floor = area.floor;

        // 应用楼层筛选
        if (currentFloor !== 'all' && floor !== parseInt(currentFloor)) {
            continue;
        }

        if (!floorGroups[floor]) {
            floorGroups[floor] = [];
        }
        floorGroups[floor].push({
            name: areaName,
            ...area
        });
    }

    // 按楼层排序并显示
    Object.keys(floorGroups).sort((a, b) => parseInt(b) - parseInt(a)).forEach(floor => {
        // 楼层标题
        const floorTitle = document.createElement('div');
        floorTitle.className = 'col-12 mt-4 mb-2';
        floorTitle.innerHTML = `<h4><i class="bi bi-layers"></i> ${floor}层</h4><hr>`;
        container.appendChild(floorTitle);

        // 该楼层的所有区域
        floorGroups[floor].forEach(area => {
            const col = document.createElement('div');
            col.className = 'col-md-6 col-lg-4 mb-3';

            const availablePercent = area.stats.total > 0
                ? Math.round((area.stats.available / area.stats.total) * 100)
                : 0;

            const statusClass = area.stats.available > 0 ? 'success' : 'danger';
            const statusIcon = area.stats.available > 0 ? 'check-circle' : 'x-circle';

            col.innerHTML = `
                <div class="card h-100">
                    <div class="card-header bg-${statusClass} text-white">
                        <h6 class="mb-0">
                            <i class="bi bi-${statusIcon} me-2"></i>${area.name}
                        </h6>
                    </div>
                    <div class="card-body">
                        <div class="row text-center">
                            <div class="col-4">
                                <div class="mb-1 text-muted small">总座位</div>
                                <div class="h5 mb-0">${area.stats.total}</div>
                            </div>
                            <div class="col-4">
                                <div class="mb-1 text-muted small">空闲</div>
                                <div class="h5 mb-0 text-success">${area.stats.available}</div>
                            </div>
                            <div class="col-4">
                                <div class="mb-1 text-muted small">占用</div>
                                <div class="h5 mb-0 text-danger">${area.stats.occupied}</div>
                            </div>
                        </div>
                        <div class="progress mt-3" style="height: 25px;">
                            <div class="progress-bar bg-success" role="progressbar"
                                 style="width: ${availablePercent}%"
                                 aria-valuenow="${availablePercent}" aria-valuemin="0" aria-valuemax="100">
                                ${availablePercent}% 空闲
                            </div>
                        </div>
                    </div>
                    <div class="card-footer">
                        <button class="btn btn-sm btn-outline-primary w-100" onclick="viewAreaDetail('${area.name}')">
                            <i class="bi bi-list-ul me-1"></i>查看详情
                        </button>
                    </div>
                </div>
            `;
            container.appendChild(col);
        });
    });
}

// 查看区域详情
function viewAreaDetail(areaName) {
    document.getElementById('modalTitle').textContent = areaName + ' - 座位详情';
    document.getElementById('modalBody').innerHTML = `
        <div class="text-center py-3">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">加载中...</span>
            </div>
        </div>
    `;

    const modal = new bootstrap.Modal(document.getElementById('seatDetailModal'));
    modal.show();

    fetch(`/api/seats/detail?area=${encodeURIComponent(areaName)}&days_offset=${currentDaysOffset}`)
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                displaySeatDetails(data.seats);
            } else {
                document.getElementById('modalBody').innerHTML = `
                    <div class="alert alert-danger">获取数据失败: ${data.message}</div>
                `;
            }
        })
        .catch(error => {
            console.error('Error:', error);
            document.getElementById('modalBody').innerHTML = `
                <div class="alert alert-danger">获取数据失败，请稍后重试</div>
            `;
        });
}

// 显示座位详情
function displaySeatDetails(seats) {
    const modalBody = document.getElementById('modalBody');

    if (!seats || seats.length === 0) {
        modalBody.innerHTML = '<div class="alert alert-info">暂无座位数据</div>';
        return;
    }

    let html = '<div class="table-responsive"><table class="table table-hover">';
    html += '<thead><tr><th>座位号</th><th>状态</th><th>预约信息</th></tr></thead><tbody>';

    seats.forEach(seat => {
        const statusBadge = seat.isAvailable
            ? '<span class="badge bg-success">空闲</span>'
            : '<span class="badge bg-danger">已占用</span>';

        let resvInfo = '';
        if (seat.reservations && seat.reservations.length > 0) {
            resvInfo = seat.reservations.map(resv =>
                `<div class="small">${resv.startTime} - ${resv.endTime} (${resv.status})</div>`
            ).join('');
        } else {
            resvInfo = '<span class="text-muted small">-</span>';
        }

        html += `
            <tr>
                <td><strong>${seat.devName}</strong></td>
                <td>${statusBadge}</td>
                <td>${resvInfo}</td>
            </tr>
        `;
    });

    html += '</tbody></table></div>';
    modalBody.innerHTML = html;
}
</script>

<style>
.card {
    transition: transform 0.2s, box-shadow 0.2s;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

.progress {
    border-radius: 10px;
}

.progress-bar {
    border-radius: 10px;
    font-weight: bold;
}

/* 强制座位详情弹窗内容可滚动 - 最终修复 */
#seatDetailModal .modal-dialog.modal-dialog-scrollable {
    max-height: calc(100vh - 3.5rem) !important; /* 强制最大高度 */
}
#seatDetailModal .modal-content {
    overflow: hidden !important; /* 隐藏容器的溢出 */
}
#seatDetailModal .modal-body {
    overflow-y: auto !important; /* 仅在body上启用垂直滚动 */
}
</style>
{% endblock %}

{% block modals %}
<!-- 座位详情模态框 -->
<div class="modal fade" id="seatDetailModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">座位详情</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- 动态加载 -->
            </div>
        </div>
    </div>
</div>
{% endblock %}
