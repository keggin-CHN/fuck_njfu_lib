<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>本地复现 - 二层A区座位图</title>
  <style>
    :root {
      --available: #50ac33;
      --occupied: #ffc835;
      --target: #ff4d4f;
      --bg: #f6f8fa;
      --panel: #ffffff;
      --text: #1f2328;
      --border: #d0d7de;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .page {
      max-width: 1380px;
      margin: 0 auto;
      padding: 16px;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 12px;
      padding: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .toolbar input {
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      min-width: 180px;
    }

    .toolbar button {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
    }

    .stats {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-left: auto;
      font-size: 14px;
    }

    .legend { display: inline-flex; align-items: center; gap: 6px; }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      border: 1px solid rgba(0,0,0,0.15);
    }

    .seat-wrap {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 12px;
    }

    .seat-area {
      position: relative;
      width: 100%;
      min-height: 78vh;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .bg-image {
      width: 100%;
      max-width: 100%;
      vertical-align: middle;
      pointer-events: none;
      opacity: 0.65;
      display: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .grid {
      position: relative;
      width: 100%;
      min-height: 300px;
      z-index: 1;
      background:
        linear-gradient(to right, rgba(0,0,0,0.03) 1px, transparent 1px) 0 0 / 32px 32px,
        linear-gradient(to bottom, rgba(0,0,0,0.03) 1px, transparent 1px) 0 0 / 32px 32px;
    }

    .corridor-band {
      position: absolute;
      background: rgba(80, 120, 255, 0.10);
      border: 1px dashed rgba(80, 120, 255, 0.35);
      z-index: 1;
      pointer-events: none;
    }

    .facility-tip {
      position: absolute;
      transform: translate(-50%, -50%);
      z-index: 2;
      pointer-events: none;
      font-size: 11px;
      color: #334;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(0,0,0,0.15);
      border-radius: 6px;
      padding: 2px 4px;
      white-space: nowrap;
    }

    .seat {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.2);
      cursor: pointer;
      padding: 0;
      z-index: 2;
    }

    .seat.center-anchor {
      transform: translate(-50%, -50%);
    }

    .seat.available { background: var(--available); }
    .seat.occupied { background: var(--occupied); }

    .seat.target {
      outline: 2px solid var(--target);
      outline-offset: 2px;
      z-index: 3;
    }

    .seat:hover { z-index: 2; }

    .seat-label {
      position: absolute;
      top: -16px;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      font-size: 11px;
      line-height: 1;
      color: #111;
      display: none;
      background: rgba(255,255,255,0.9);
      border-radius: 3px;
      padding: 1px 3px;
    }

    .seat:hover .seat-label,
    .seat.target .seat-label { display: block; }

    .panel {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      background: var(--panel);
      font-size: 14px;
      line-height: 1.6;
    }

    .panel h3 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    .muted { color: #666; }

    .error {
      margin-top: 10px;
      color: #b42318;
      background: #ffebe9;
      border: 1px solid #ff818266;
      border-radius: 8px;
      padding: 8px 10px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="toolbar">
      <strong>本地座位图复现（二层A区 roomId=100455344）</strong>
      <label>目标座位:
        <input id="targetInput" value="2F-A409" />
      </label>
      <button id="applyBtn">定位</button>
      <label class="muted"><input type="checkbox" id="showCorridor" checked /> 显示楼道(推断)</label>
      <label class="muted"><input type="checkbox" id="centerAnchor" /> 中心锚点</label>
      <label class="muted">X偏移(%)
        <input id="offsetX" type="number" step="0.1" value="0" style="width:72px;min-width:72px;" />
      </label>
      <label class="muted">Y偏移(%)
        <input id="offsetY" type="number" step="0.1" value="0" style="width:72px;min-width:72px;" />
      </label>
      <label class="muted">X缩放
        <input id="scaleX" type="number" step="0.001" value="1" style="width:78px;min-width:78px;" />
      </label>
      <label class="muted">Y缩放
        <input id="scaleY" type="number" step="0.001" value="1" style="width:78px;min-width:78px;" />
      </label>
      <div class="stats">
        <span class="legend"><i class="dot" style="background:#50ac33"></i>可用 <b id="okCount">0</b></span>
        <span class="legend"><i class="dot" style="background:#ffc835"></i>占用 <b id="busyCount">0</b></span>
        <span class="legend"><i class="dot" style="background:#ff4d4f"></i>目标座位</span>
      </div>
    </div>

    <div class="seat-wrap">
      <div class="seat-area">
        <div id="grid" class="grid">
          <img id="bgImage" class="bg-image" alt="room background" />
        </div>
      </div>
      <aside class="panel">
        <h3>选中座位信息</h3>
        <div id="detail" class="muted">点击左侧任意座位查看详情</div>
        <hr />
        <div class="muted">数据文件: <code>./data/seat_positions.json</code> / <code>./data/seat_positions.js</code></div>
        <div class="muted">说明: 坐标按接口 <code>coordinate</code> 百分比映射渲染。</div>
        <div class="muted">桌子/卫生间来自背景图（精确）；楼道蓝色蒙层为几何推断辅助。</div>
        <div id="errorBox"></div>
      </aside>
    </div>
  </div>

  <script src="./data/map_meta.js"></script>
  <script src="./data/seat_positions.js"></script>
  <script>
    const grid = document.getElementById('grid');
    const detail = document.getElementById('detail');
    const errorBox = document.getElementById('errorBox');
    const input = document.getElementById('targetInput');
    const okCount = document.getElementById('okCount');
    const busyCount = document.getElementById('busyCount');
    const bgImage = document.getElementById('bgImage');
    const offsetXInput = document.getElementById('offsetX');
    const offsetYInput = document.getElementById('offsetY');
    const scaleXInput = document.getElementById('scaleX');
    const scaleYInput = document.getElementById('scaleY');
    const centerAnchorInput = document.getElementById('centerAnchor');

    const CALIB_KEY = 'seat_map_calibration_v1';

    let seats = [];
    let corridorBands = [];
    const mapMeta = window.__MAP_META__ || null;

    function showError(msg) {
      errorBox.innerHTML = '<div class="error">' + msg + '</div>';
    }

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function num(v, fallback = 0) {
      const n = Number(v);
      return Number.isFinite(n) ? n : fallback;
    }

    function getCalibration() {
      return {
        offsetX: num(offsetXInput?.value, 0),
        offsetY: num(offsetYInput?.value, 0),
        scaleX: num(scaleXInput?.value, 1),
        scaleY: num(scaleYInput?.value, 1),
      };
    }

    function saveCalibration() {
      try {
        const c = getCalibration();
        const payload = {
          ...c,
          centerAnchor: !!centerAnchorInput?.checked,
        };
        localStorage.setItem(CALIB_KEY, JSON.stringify(payload));
      } catch (_) {}
    }

    function loadCalibration() {
      try {
        const txt = localStorage.getItem(CALIB_KEY);
        if (!txt) return;
        const c = JSON.parse(txt);
        if (offsetXInput && Number.isFinite(Number(c.offsetX))) offsetXInput.value = String(c.offsetX);
        if (offsetYInput && Number.isFinite(Number(c.offsetY))) offsetYInput.value = String(c.offsetY);
        if (scaleXInput && Number.isFinite(Number(c.scaleX))) scaleXInput.value = String(c.scaleX);
        if (scaleYInput && Number.isFinite(Number(c.scaleY))) scaleYInput.value = String(c.scaleY);
        if (centerAnchorInput) centerAnchorInput.checked = !!c.centerAnchor;
      } catch (_) {}
    }

    function mapCoord(x, y) {
      const c = getCalibration();
      const nx = clamp(num(x, 0) * c.scaleX + c.offsetX, -200, 300);
      const ny = clamp(num(y, 0) * c.scaleY + c.offsetY, -200, 300);
      return [nx, ny];
    }

    function clearDynamicLayers() {
      grid.querySelectorAll('.seat, .corridor-band, .facility-tip').forEach(el => el.remove());
    }

    function inferCorridorBands(list) {
      const valsX = [...new Set(list.map(s => s.x).filter(v => typeof v === 'number').map(v => +v.toFixed(3)))].sort((a,b)=>a-b);
      const valsY = [...new Set(list.map(s => s.y).filter(v => typeof v === 'number').map(v => +v.toFixed(3)))].sort((a,b)=>a-b);
      const bands = [];

      for (let i = 0; i < valsX.length - 1; i++) {
        const a = valsX[i], b = valsX[i+1];
        const gap = b - a;
        if (gap > 4.8) {
          bands.push({ type: 'v', center: (a + b) / 2, gap });
        }
      }

      for (let i = 0; i < valsY.length - 1; i++) {
        const a = valsY[i], b = valsY[i+1];
        const gap = b - a;
        if (gap > 6.0) {
          bands.push({ type: 'h', center: (a + b) / 2, gap });
        }
      }

      return bands;
    }

    function renderMapLayers() {
      const showCorridor = document.getElementById('showCorridor')?.checked;

      if (showCorridor) {
        corridorBands.forEach(b => {
          const band = document.createElement('div');
          band.className = 'corridor-band';
          if (b.type === 'v') {
            const [leftRaw] = mapCoord(b.center - b.gap / 2, 0);
            const [rightRaw] = mapCoord(b.center + b.gap / 2, 0);
            const left = clamp(leftRaw, 0, 100);
            const right = clamp(rightRaw, 0, 100);
            band.style.left = left + '%';
            band.style.top = '0%';
            band.style.width = Math.max(0, right - left) + '%';
            band.style.height = '100%';
          } else {
            const [, topRaw] = mapCoord(0, b.center - b.gap / 2);
            const [, bottomRaw] = mapCoord(0, b.center + b.gap / 2);
            const top = clamp(topRaw, 0, 100);
            const bottom = clamp(bottomRaw, 0, 100);
            band.style.left = '0%';
            band.style.top = top + '%';
            band.style.width = '100%';
            band.style.height = Math.max(0, bottom - top) + '%';
          }
          grid.appendChild(band);
        });
      }

      // 卫生间/楼道/桌子等精确信息优先来自背景图接口
      const [tipXRaw, tipYRaw] = mapCoord(8, 5);
      const tipX = clamp(tipXRaw, 0, 100);
      const tipY = clamp(tipYRaw, 0, 100);
      if (mapMeta?.bg?.saved) {
        const tip = document.createElement('div');
        tip.className = 'facility-tip';
        tip.style.left = tipX + '%';
        tip.style.top = tipY + '%';
        tip.textContent = '已加载背景图（含卫生间/楼道等）';
        grid.appendChild(tip);
      } else {
        const tip = document.createElement('div');
        tip.className = 'facility-tip';
        tip.style.left = tipX + '%';
        tip.style.top = tipY + '%';
        tip.textContent = '卫生间位置未拿到（接口未返回背景图）';
        grid.appendChild(tip);
      }
    }

    function initBackground() {
      if (mapMeta?.bg?.saved && mapMeta?.bg?.fileName) {
        bgImage.src = './data/' + mapMeta.bg.fileName;
        bgImage.style.display = 'block';
        bgImage.onload = () => render(input.value || '2F-A409');
      } else {
        bgImage.style.display = 'none';
      }
    }

    function render(targetName) {
      clearDynamicLayers();
      const normalizedTarget = (targetName || '').trim().toUpperCase();

      renderMapLayers();

      let occupied = 0;
      let available = 0;

      seats.forEach(seat => {
        if (seat.occupied) occupied += 1; else available += 1;
        if (typeof seat.x !== 'number' || typeof seat.y !== 'number') return;

        const [left, top] = mapCoord(seat.x, seat.y);
        const btn = document.createElement('button');
        const isTarget = seat.devName && seat.devName.toUpperCase() === normalizedTarget;
        btn.className = 'seat ' + (seat.occupied ? 'occupied' : 'available') + (isTarget ? ' target' : '');
        if (centerAnchorInput?.checked) btn.classList.add('center-anchor');
        btn.style.left = left + '%';
        btn.style.top = top + '%';
        btn.title = `${seat.devName} | ${seat.occupied ? '占用' : '可用'} | (${seat.coordinate})`;

        const label = document.createElement('span');
        label.className = 'seat-label';
        label.textContent = seat.devName?.slice(-3) || '';
        btn.appendChild(label);

        btn.onclick = () => {
          detail.innerHTML = `
            <div><b>${seat.devName}</b></div>
            <div>devId: ${seat.devId}</div>
            <div>状态: ${seat.occupied ? '占用' : '可用'}</div>
            <div>预约段数量: ${seat.resvCount}</div>
            <div>坐标: ${seat.coordinate}</div>
            <div>devStatus: ${seat.devStatus}</div>
          `;
        };

        grid.appendChild(btn);
      });

      okCount.textContent = available;
      busyCount.textContent = occupied;
    }

    async function load() {
      // 优先使用本地 JS 注入数据，兼容 file:// 直接打开
      if (Array.isArray(window.__SEAT_POSITIONS__) && window.__SEAT_POSITIONS__.length > 0) {
        seats = window.__SEAT_POSITIONS__;
        corridorBands = inferCorridorBands(seats);
        initBackground();
        render(input.value || '2F-A409');
        return;
      }

      // 其次尝试 fetch（适用于 http(s) 静态服务）
      try {
        const resp = await fetch('./data/seat_positions.json');
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        seats = await resp.json();
        corridorBands = inferCorridorBands(seats);
        initBackground();
        render(input.value || '2F-A409');
      } catch (err) {
        showError(
          '加载座位数据失败。\n' +
          '你当前可能是 file:// 直接打开，或静态服务未启动。\n\n' +
          '可选方案A（推荐，直接双击HTML可用）：确认 ./data/seat_positions.js 文件存在；\n' +
          '可选方案B（本地服务）：python -m http.server 8000 --directory explore/local_repro\n\n' +
          `错误: ${err.message}`
        );
      }
    }

    document.getElementById('applyBtn').onclick = () => render(input.value);
    document.getElementById('showCorridor').onchange = () => render(input.value);
    [offsetXInput, offsetYInput, scaleXInput, scaleYInput, centerAnchorInput].forEach(el => {
      if (!el) return;
      el.addEventListener('input', () => {
        saveCalibration();
        render(input.value);
      });
      el.addEventListener('change', () => {
        saveCalibration();
        render(input.value);
      });
    });
    window.addEventListener('resize', () => render(input.value));
    loadCalibration();
    load();
  </script>
</body>
</html>
