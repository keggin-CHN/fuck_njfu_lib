<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时流量 - 图书馆信息查询</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="bi bi-book me-2"></i>图书馆信息查询
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            <i class="bi bi-house"></i> 首页
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="traffic.html">
                            <i class="bi bi-person-lines-fill"></i> 实时流量
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="seats.html">
                            <i class="bi bi-grid-3x3"></i> 座位查询
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>
                        <i class="bi bi-person-lines-fill me-2 text-primary"></i>
                        图书馆实时流量
                    </h2>
                    <button class="btn btn-primary" id="refreshBtn" onclick="loadTrafficData()">
                        <i class="bi bi-arrow-clockwise me-1"></i>刷新
                    </button>
                </div>
            </div>
        </div>

        <!-- 加载提示 -->
        <div id="loadingIndicator" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">加载中...</span>
            </div>
            <p class="mt-3 text-muted">正在获取流量数据...</p>
        </div>

        <!-- 流量数据展示 -->
        <div id="trafficDisplay" style="display: none;">
            <div class="row mb-4">
                <div class="col-md-4 mb-3">
                    <div class="card border-primary">
                        <div class="card-body text-center">
                            <h6 class="card-subtitle mb-2 text-muted">
                                <i class="bi bi-people-fill"></i> 在馆人数
                            </h6>
                            <h2 class="card-title display-4 text-primary mb-0" id="currentCount">-</h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 mb-3">
                    <div class="card border-info">
                        <div class="card-body text-center">
                            <h6 class="card-subtitle mb-2 text-muted">
                                <i class="bi bi-building"></i> 总容量
                            </h6>
                            <h2 class="card-title display-4 text-info mb-0" id="totalCapacity">-</h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 mb-3">
                    <div class="card border-warning">
                        <div class="card-body text-center">
                            <h6 class="card-subtitle mb-2 text-muted">
                                <i class="bi bi-percent"></i> 占用率
                            </h6>
                            <h2 class="card-title display-4 text-warning mb-0" id="percentage">-</h2>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title mb-3">
                                <i class="bi bi-graph-up me-2"></i>占用率可视化
                            </h5>
                            <div class="progress" style="height: 40px;">
                                <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" 
                                     role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                                    <span class="fs-5 fw-bold">0%</span>
                                </div>
                            </div>
                            <p class="text-muted mt-3 mb-0">
                                <i class="bi bi-clock me-1"></i>
                                更新时间：<span id="updateTime">-</span>
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row mt-4">
                <div class="col-12">
                    <div class="alert alert-info">
                        <i class="bi bi-info-circle me-2"></i>
                        <strong>提示：</strong>数据每次点击刷新时实时从图书馆系统获取，可能需要几秒钟时间。
                    </div>
                </div>
            </div>
        </div>

        <!-- 错误提示 -->
        <div id="errorDisplay" class="alert alert-danger" style="display: none;">
            <i class="bi bi-exclamation-triangle me-2"></i>
            <span id="errorMessage"></span>
        </div>
    </div>

    <footer class="mt-5 py-4 bg-light">
        <div class="container text-center text-muted">
            <p class="mb-0">
                <i class="bi bi-code-slash me-1"></i>
                基于 Cloudflare Workers & Pages 构建
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/js/config.js"></script>
    <script src="./assets/js/traffic.js"></script>
</body>
</html>
