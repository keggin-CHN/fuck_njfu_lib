name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:  # 允许手动触发

jobs:
  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd worker
          npm install

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: 'worker'
          secrets: |
            USERNAME
            EDU_PASSWORD
            LIB_PASSWORD
        env:
          USERNAME: ${{ secrets.USERNAME }}
          EDU_PASSWORD: ${{ secrets.EDU_PASSWORD }}
          LIB_PASSWORD: ${{ secrets.LIB_PASSWORD }}

      - name: Get Worker URL
        id: worker-url
        run: |
          echo "WORKER_URL=https://library-info-worker.${{ secrets.CLOUDFLARE_ACCOUNT_SUBDOMAIN }}.workers.dev" >> $GITHUB_OUTPUT

      - name: Update Pages config
        run: |
          WORKER_URL="${{ steps.worker-url.outputs.WORKER_URL }}"
          sed -i "s|const API_BASE_URL = '.*';|const API_BASE_URL = '${WORKER_URL}';|" pages/assets/js/config.js

      - name: Commit updated config
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add pages/assets/js/config.js
          git diff --quiet && git diff --staged --quiet || git commit -m "Update API URL for deployment"
          git push || echo "No changes to push"

  deploy-pages:
    name: Deploy Pages
    runs-on: ubuntu-latest
    needs: deploy-worker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy pages --project-name=library-info

      - name: Deployment Summary
        run: |
          echo "### Deployment Complete! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Worker URL**: https://library-info-worker.${{ secrets.CLOUDFLARE_ACCOUNT_SUBDOMAIN }}.workers.dev" >> $GITHUB_STEP_SUMMARY
          echo "- **Pages URL**: https://library-info.pages.dev" >> $GITHUB_STEP_SUMMARY
