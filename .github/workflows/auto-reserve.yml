name: 图书馆座位自动预约

on:
  schedule:
    # 每天早上6:58（北京时间）执行，对应UTC时间是22:58（前一天）
    # 提前2分钟启动，留出时间安装依赖，然后在7:00:04准时预约
    - cron: '58 22 * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  reserve-seat:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout 代码
      uses: actions/checkout@v4
    
    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: 安装依赖
      run: |
        cd backend
        pip install requests beautifulsoup4 pycryptodome cryptography pytz
    
    - name: 执行座位预约
      env:
        STUDENT_ID: ${{ secrets.STUDENT_ID }}
        EDU_PASSWORD: ${{ secrets.EDU_PASSWORD }}
        LIB_PASSWORD: ${{ secrets.LIB_PASSWORD }}
        SEAT_AREA: ${{ secrets.SEAT_AREA }}
        SEAT_NUMBER: ${{ secrets.SEAT_NUMBER }}
        START_TIME: ${{ secrets.START_TIME }}
        END_TIME: ${{ secrets.END_TIME }}
        NOTIFICATION_TYPE: ${{ secrets.NOTIFICATION_TYPE }}
        WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      run: |
        cd backend
        python << 'EOF'
        import os
        import sys
        import logging
        import time
        from datetime import datetime
        import pytz
        from utils.auth_manager import LibraryAuthenticator
        from utils.date_utils import get_tomorrow_date, normalize_time_format
        from config import Config

        # 配置日志
        logging.basicConfig(
            level=logging.INFO,
            format='%(asctime)s - %(levelname)s - %(message)s',
            handlers=[
                logging.FileHandler('reservation.log', encoding='utf-8'),
                logging.StreamHandler()
            ]
        )
        logger = logging.getLogger(__name__)

        # 获取环境变量配置
        STUDENT_ID = os.getenv('STUDENT_ID')
        EDU_PASSWORD = os.getenv('EDU_PASSWORD')
        LIB_PASSWORD = os.getenv('LIB_PASSWORD')
        SEAT_AREA = os.getenv('SEAT_AREA')
        SEAT_NUMBER = int(os.getenv('SEAT_NUMBER', '1'))
        START_TIME = os.getenv('START_TIME', '09:30')
        END_TIME = os.getenv('END_TIME', '22:00')
        NOTIFICATION_TYPE = os.getenv('NOTIFICATION_TYPE', 'none')
        WEBHOOK_URL = os.getenv('WEBHOOK_URL', '')

        logger.info("="*60)
        logger.info("开始执行图书馆座位自动预约")
        logger.info(f"学号: {STUDENT_ID}")
        logger.info(f"座位: {SEAT_AREA} {SEAT_NUMBER}号")
        logger.info(f"时间: {START_TIME} - {END_TIME}")
        logger.info("="*60)

        # 等待到北京时间7:00:04
        tz = pytz.timezone('Asia/Shanghai')
        while True:
            now = datetime.now(tz)
            if now.hour == 7 and now.minute == 0 and now.second >= 4:
                logger.info(f"⏰ 已到达预约时间: {now.strftime('%H:%M:%S')}")
                break
            elif now.hour > 7 or (now.hour == 7 and now.minute > 0):
                logger.info(f"⏰ 当前时间: {now.strftime('%H:%M:%S')}，直接开始预约")
                break
            else:
                wait_seconds = (7 - now.hour) * 3600 + (0 - now.minute) * 60 + (4 - now.second)
                if wait_seconds > 0 and wait_seconds < 180:
                    logger.info(f"⏰ 当前时间: {now.strftime('%H:%M:%S')}，等待 {wait_seconds} 秒到达7:00:04...")
                    time.sleep(min(wait_seconds, 1))
                else:
                    logger.info(f"⏰ 当前时间: {now.strftime('%H:%M:%S')}，直接开始预约")
                    break

        # 验证必填参数
        if not all([STUDENT_ID, EDU_PASSWORD, LIB_PASSWORD, SEAT_AREA]):
            logger.error("缺少必填配置，请检查 GitHub Secrets")
            sys.exit(1)

        try:
            # 1. 认证
            logger.info("步骤1: 开始认证...")
            authenticator = LibraryAuthenticator(STUDENT_ID, EDU_PASSWORD, LIB_PASSWORD)
            auth_result, need_captcha, error_msg = authenticator.authenticate()
            
            if not auth_result:
                if need_captcha:
                    logger.error("认证失败: 需要验证码，GitHub Actions 无法处理验证码")
                else:
                    logger.error(f"认证失败: {error_msg}")
                sys.exit(1)
            
            logger.info("✓ 认证成功")
            logger.info(f"  Token: {authenticator.token[:20]}...")
            logger.info(f"  AccNo: {authenticator.acc_no}")

            # 2. 计算座位ID
            logger.info("\n步骤2: 计算座位ID...")
            seat_id = Config.get_seat_id(SEAT_AREA, SEAT_NUMBER)
            if not seat_id:
                logger.error(f"无效的座位配置: {SEAT_AREA} {SEAT_NUMBER}号")
                sys.exit(1)
            logger.info(f"✓ 座位ID: {seat_id}")

            # 3. 预约座位
            logger.info("\n步骤3: 开始预约座位...")
            from utils.auth_manager import HttpClient
            
            date_str = get_tomorrow_date()
            start_time = normalize_time_format(START_TIME)
            end_time = normalize_time_format(END_TIME)
            
            begin_time = f"{date_str} {start_time}"
            full_end_time = f"{date_str} {end_time}"
            
            logger.info(f"预约日期: {date_str}")
            logger.info(f"预约时间: {start_time} - {end_time}")
            
            reserve_url = HttpClient.get_lib_url("ic-web/reserve?vpn-12-libseat.njfu.edu.cn")
            
            payload = {
                "sysKind": 8,
                "appAccNo": authenticator.acc_no,
                "memberKind": 1,
                "resvMember": [authenticator.acc_no],
                "resvBeginTime": begin_time,
                "resvEndTime": full_end_time,
                "resvDev": [seat_id],
                "resvProperty": 0,
                "memo": "",
                "captcha": "",
                "testName": ""
            }
            
            api_headers = {
                "content-type": "application/json;charset=UTF-8",
                "token": authenticator.token,
                "lan": "1"
            }
            
            response = authenticator.session.post(reserve_url, headers=api_headers, json=payload, timeout=15)
            
            if response and response.status_code == 200:
                result = response.json()
                if result.get("code") == 0:
                    logger.info("="*60)
                    logger.info("🎉 预约成功!")
                    logger.info(f"座位: {SEAT_AREA} {SEAT_NUMBER}号")
                    logger.info(f"日期: {date_str}")
                    logger.info(f"时间: {start_time} - {end_time}")
                    logger.info("="*60)
                    
                    # 发送通知
                    if NOTIFICATION_TYPE != 'none' and WEBHOOK_URL:
                        try:
                            import requests
                            now = datetime.now().strftime('%Y-%m-%d %H:%M:%S')
                            
                            if NOTIFICATION_TYPE == 'wechat':
                                message = "## 图书馆预约成功通知\n"
                                message += f"> **学号**: {STUDENT_ID}\n"
                                message += f"> **时间**: {now}\n\n"
                                message += "### ✅ 预约成功\n\n"
                                message += f"> **日期**: {date_str}\n"
                                message += f"> **座位**: {SEAT_AREA} {SEAT_NUMBER}号\n"
                                message += f"> **时间**: {start_time} - {end_time}\n"
                                data = {"msgtype": "markdown", "markdown": {"content": message}}
                            elif NOTIFICATION_TYPE == 'telegram':
                                message = "📚 *图书馆预约成功通知*\n\n"
                                message += f"👤 学号: `{STUDENT_ID}`\n"
                                message += f"🕒 时间: {now}\n\n"
                                message += "*✅ 预约成功*\n\n"
                                message += f"• *日期*: {date_str}\n"
                                message += f"• *座位*: {SEAT_AREA} {SEAT_NUMBER}号\n"
                                message += f"• *时间*: {start_time} - {end_time}\n"
                                data = {"text": message, "parse_mode": "Markdown"}
                            else:
                                data = None
                            
                            if data:
                                notif_resp = requests.post(WEBHOOK_URL, json=data, timeout=10)
                                if notif_resp.status_code == 200:
                                    logger.info("✓ 通知发送成功")
                        except Exception as e:
                            logger.warning(f"通知发送失败: {e}")
                    
                    sys.exit(0)
                else:
                    error_msg = result.get('message', '未知错误')
                    logger.error(f"❌ 预约失败: {error_msg}")
                    
                    # 发送失败通知
                    if NOTIFICATION_TYPE != 'none' and WEBHOOK_URL:
                        try:
                            import requests
                            now = datetime.now().strftime('%Y-%m-%d %H:%M:%S')
                            
                            if NOTIFICATION_TYPE == 'wechat':
                                message = "## 图书馆预约失败通知\n"
                                message += f"> **学号**: {STUDENT_ID}\n"
                                message += f"> **时间**: {now}\n\n"
                                message += "### ❌ 预约失败\n\n"
                                message += f"> **日期**: {date_str}\n"
                                message += f"> **座位**: {SEAT_AREA} {SEAT_NUMBER}号\n"
                                message += f"> **时间**: {start_time} - {end_time}\n"
                                message += f"> **原因**: {error_msg}\n"
                                data = {"msgtype": "markdown", "markdown": {"content": message}}
                            elif NOTIFICATION_TYPE == 'telegram':
                                message = "📚 *图书馆预约失败通知*\n\n"
                                message += f"👤 学号: `{STUDENT_ID}`\n"
                                message += f"🕒 时间: {now}\n\n"
                                message += "*❌ 预约失败*\n\n"
                                message += f"• *日期*: {date_str}\n"
                                message += f"• *座位*: {SEAT_AREA} {SEAT_NUMBER}号\n"
                                message += f"• *时间*: {start_time} - {end_time}\n"
                                message += f"• *原因*: {error_msg}\n"
                                data = {"text": message, "parse_mode": "Markdown"}
                            else:
                                data = None
                            
                            if data:
                                requests.post(WEBHOOK_URL, json=data, timeout=10)
                        except:
                            pass
                    
                    sys.exit(1)
            else:
                status = response.status_code if response else "无响应"
                logger.error(f"❌ 预约请求失败，状态码: {status}")
                sys.exit(1)
                
        except Exception as e:
            logger.error(f"执行出错: {e}", exc_info=True)
            sys.exit(1)
        EOF
    
    - name: 上传日志
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: reservation-logs-${{ github.run_number }}
        path: backend/reservation.log
        retention-days: 7
